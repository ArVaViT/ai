name: AI review

# Manual Grok review bot. Checks out the base branch for the script, then
# fetches the PR head into a second worktree for read/edit.
# pull_request_target (labeled only) runs in the base repo with secrets, so a
# maintainer adding the ai-review label works on fork PRs. There is no
# automatic run on opened/synchronize: fork PRs get no secrets under
# pull_request and need approval before any workflow runs, so auto would fail
# red on every new PR. Never pnpm install in the PR tree.

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
  issue_comment:
    types: [created]

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions: {}

jobs:
  review:
    name: Review
    if: >
      (github.event_name == 'pull_request_target'
        && github.event.action == 'labeled'
        && github.event.label.name == 'ai-review'
        && (github.event.sender.login == 'AlemTuzlak'
          || github.event.sender.login == 'tombeckenham'
          || github.event.sender.login == 'jherr'))
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/ai-review'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checkout is always the trusted base (pull_request_target checks out
      # the base; issue_comment and workflow_dispatch check out the default
      # branch). The untrusted PR head is only fetched into .pr-head below
      # for file reads. Never check out or build the PR head here.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main
      - name: Build packages
        run: pnpm exec nx run @tanstack/ai-grok-build:build
      - name: Add PR head worktree
        id: guard
        env:
          AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER_PULL: ${{ github.event.pull_request.number }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
          PR_NUMBER_DISPATCH: ${{ github.event.inputs.pr_number }}
        shell: bash
        run: |
          if [ -z "${AI_REVIEW_TOKEN}" ] || [ -z "${XAI_API_KEY}" ]; then
            echo "AI review skipped: missing AI_REVIEW_TOKEN or XAI_API_KEY"
            echo "has_secrets=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          case "${EVENT_NAME}" in
            pull_request_target)
              PR_NUMBER="${PR_NUMBER_PULL}"
              ;;
            issue_comment)
              PR_NUMBER="${PR_NUMBER_ISSUE}"
              ;;
            workflow_dispatch)
              PR_NUMBER="${PR_NUMBER_DISPATCH}"
              ;;
            *)
              echo "unsupported event ${EVENT_NAME}"
              exit 1
              ;;
          esac
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "invalid PR number"
            exit 1
          fi
          git fetch origin "pull/${PR_NUMBER}/head:ai-review-pr-head"
          git worktree add "${GITHUB_WORKSPACE}/.pr-head" ai-review-pr-head
          SHA="$(git -C "${GITHUB_WORKSPACE}/.pr-head" rev-parse HEAD)"
          LOGIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '.author.login // empty' || true)"
          MACHINE="$(gh api user --jq .login)"
          echo "AI_REVIEW_HEAD_COMMIT_AUTHOR=${LOGIN}" >> "${GITHUB_ENV}"
          echo "AI_REVIEW_MACHINE_USER=${MACHINE}" >> "${GITHUB_ENV}"
          echo "has_secrets=true" >> "${GITHUB_OUTPUT}"
      - name: Run review
        if: steps.guard.outputs.has_secrets == 'true'
        run: pnpm ai-review
        env:
          AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_REVIEW_WORKTREE: ${{ github.workspace }}/.pr-head
