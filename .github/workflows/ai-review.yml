name: AI review

# The reviewer runs trusted main code. Signal metadata identifies the PR.
# A maintainer can request one review with the ai-review label.

on: # zizmor: ignore[dangerous-triggers] This job uses no artifacts or PR code.
  pull_request_target:
    branches: [main]
    types: [labeled]
  workflow_run:
    workflows: ['AI review signal']
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    name: Review
    if: >
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request_target'
        && github.event.action == 'labeled'
        && github.event.label.name == 'ai-review'
        && contains(fromJSON('["tombeckenham","AlemTuzlak","jherr"]'), github.event.sender.login))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '/ai-review')
        && contains(fromJSON('["tombeckenham","AlemTuzlak","jherr"]'), github.event.comment.user.login))
    concurrency:
      group: ai-review-${{ (github.event_name == 'workflow_run' || github.event_name == 'pull_request_target') && 'source' || 'pr' }}-${{ github.event.workflow_run.head_repository.id || github.event.pull_request.head.repo.id || github.repository_id }}-${{ github.event.workflow_run.head_branch || github.event.pull_request.head.ref || github.event.issue.number || github.event.inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checkout is always the trusted base (workflow_run checks out the
      # default branch; issue_comment and workflow_dispatch do too).
      # Never build or run the PR head. The review script fetches the audited SHA
      # into .pr-head only when it has a validated patch to apply.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Tools
        uses: TanStack/config/.github/setup@190f659075ff0845850e330883eb26d7ffd0671f # main
      - name: Build packages
        run: pnpm exec nx run-many -t build -p @tanstack/ai-grok-build @tanstack/ai-sandbox-docker
      - name: Guard review
        id: guard
        env:
          AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GH_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
        shell: bash
        run: |
          skip() {
            echo "AI review skipped: $1"
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }
          if [ -z "${AI_REVIEW_TOKEN}" ] || [ -z "${XAI_API_KEY}" ]; then
            skip "missing AI_REVIEW_TOKEN or XAI_API_KEY"
          fi
          MACHINE="$(gh api user --jq .login)"
          LOGIN_PATTERN='^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$'
          if ! [[ "${MACHINE}" =~ ${LOGIN_PATTERN} ]]; then
            skip "invalid GitHub login"
          fi
          echo "machine_user=${MACHINE}" >> "${GITHUB_OUTPUT}"
          echo "proceed=true" >> "${GITHUB_OUTPUT}"
      - name: Run review
        if: steps.guard.outputs.proceed == 'true'
        run: pnpm ai-review
        env:
          AI_REVIEW_TOKEN: ${{ secrets.AI_REVIEW_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          AI_REVIEW_WORKTREE: ${{ github.workspace }}/.pr-head
          AI_REVIEW_MACHINE_USER: ${{ steps.guard.outputs.machine_user }}
